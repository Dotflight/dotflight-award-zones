name: Correction
description: Something in the data is wrong.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Public facts only, each with a public link and the date you read it. Never send:
        - seats, dates or prices you saw while searching in your own SAS account or app;
        - screenshots of any account, search or booking;
        - booking references, ticket numbers, EuroBonus numbers, names, email addresses or anything else about a person;
        - names of SAS staff, case numbers, or SAS's words quoted;
        - data copied from paid tools or other award search sites (their terms and database rights apply).
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what it should be
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public link
      description: SAS's own page first; an airline's own page or press release next.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: read
    attributes:
      label: Date you read it
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you send
      options:
        - label: The link is public and says what I describe.
          required: true
        - label: Nothing here is from my own SAS account, a booking, a screenshot or a paid tool.
          required: true
        - label: There are no personal details in this issue.
          required: true
